plugins { id 'com.android.application' }

android { namespace 'com.greshserg.ps2udpfs'; compileSdk 35
    defaultConfig {
        applicationId 'com.greshserg.ps2udpfs'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.0.4'
        ndk { abiFilters 'arm64-v8a' }
    }
    // udpfsd is an executable packaged in the native directory, not a JNI library.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libudpfsd.so']
        }
    }
}

dependencies { implementation "androidx.core:core:1.15.0" }
