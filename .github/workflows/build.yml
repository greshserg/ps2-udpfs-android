name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UDPFSD_COMMIT: 58d7c8f11ac196d4a5ca7b65b78743fbeedfdd80

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Build pinned udpfsd for Android ARM64 native dir
        run: |
          rm -rf /tmp/udpfsd
          git init /tmp/udpfsd
          git -C /tmp/udpfsd remote add origin https://github.com/pcm720/udpfsd.git
          git -C /tmp/udpfsd fetch --depth 1 origin "$UDPFSD_COMMIT"
          git -C /tmp/udpfsd checkout --detach FETCH_HEAD
          git -C /tmp/udpfsd apply --check "$GITHUB_WORKSPACE/patches/udpfsd-android-wifi.patch"
          git -C /tmp/udpfsd apply "$GITHUB_WORKSPACE/patches/udpfsd-android-wifi.patch"
          cp "$GITHUB_WORKSPACE/patches/retransmit_regression_test.go" /tmp/udpfsd/udprdma/
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cd /tmp/udpfsd
          SHORT_SHA="${UDPFSD_COMMIT:0:12}"
          # CHD upstream tests require libchdr; exercise the patched transport here.
          CGO_ENABLED=0 go test -v ./udprdma
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -buildmode=pie -ldflags "-X main.Version=$SHORT_SHA-android-wifi-250ms" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libudpfsd.so" ./cmd/udpfsd
          chmod +x "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libudpfsd.so"
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libudpfsd.so"
      - name: Make Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PS2-UDPFS-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
