name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UDPFSD_COMMIT: 58d7c8f11ac196d4a5ca7b65b78743fbeedfdd80

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Use empty build and dependency caches
        run: |
          printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/ps2-gradle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'GOCACHE=%s\n' "$RUNNER_TEMP/ps2-go-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s\n' "$RUNNER_TEMP/ps2-go-mod-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Fetch pinned udpfsd source
        run: |
          rm -rf /tmp/udpfsd
          git init /tmp/udpfsd
          git -C /tmp/udpfsd remote add origin https://github.com/pcm720/udpfsd.git
          git -C /tmp/udpfsd fetch --depth 1 origin "$UDPFSD_COMMIT"
          git -C /tmp/udpfsd checkout --detach FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cd /tmp/udpfsd
          test "$(git rev-parse HEAD)" = "$UDPFSD_COMMIT"
          test -z "$(git status --porcelain)"
      - name: Reproduce lost-packet stalls on unpatched udpfsd
        run: |
          cp patches/udpfsd/nack_regression_test.go /tmp/udpfsd/udprdma/android_nack_test.go
          cd /tmp/udpfsd
          gofmt -w udprdma/android_nack_test.go
          if go test -count=1 -run 'TestAndroid(RetransmitWindow|NackProgress)' ./udprdma > "$RUNNER_TEMP/udpfs-baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/udpfs-baseline.log"
            echo 'Expected the pinned upstream to reproduce the NACK regression'
            exit 1
          fi
          cat "$RUNNER_TEMP/udpfs-baseline.log"
          python3 - <<'PY'
          import os, pathlib
          log = pathlib.Path(os.environ['RUNNER_TEMP'], 'udpfs-baseline.log').read_text()
          assert '--- FAIL: TestAndroidRetransmitWindow' in log, 'Baseline failed for an unrelated reason'
          assert '--- FAIL: TestAndroidNackProgress' in log, 'Lost ACK regression was not reproduced'
          PY
      - name: Apply NACK recovery patch and run regression tests with race detector
        run: |
          git -C /tmp/udpfsd apply --check "$GITHUB_WORKSPACE/patches/udpfsd/0001-fix-nack-recovery.patch"
          git -C /tmp/udpfsd apply "$GITHUB_WORKSPACE/patches/udpfsd/0001-fix-nack-recovery.patch"
          cd /tmp/udpfsd
          go test -race -count=1 -v ./udprdma
      - name: Build patched udpfsd for Android ARM64 native dir
        run: |
          cd /tmp/udpfsd
          SHORT_SHA="${UDPFSD_COMMIT:0:12}"
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -a -trimpath -buildmode=pie -ldflags "-X main.Version=$SHORT_SHA-android-nack1" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libudpfsd.so" ./cmd/udpfsd
          chmod +x "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libudpfsd.so"
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libudpfsd.so"
      - name: Make Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon
      - name: Build APK from scratch without cached tasks
        run: ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --refresh-dependencies --no-daemon --stacktrace
      - name: Verify APK signature, version and ARM64 executable
        run: python3 scripts/verify-apk.py
      - name: Prepare named APK and build information
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PS2-UDPFS-1.0.4-arm64.apk
          sha256sum dist/PS2-UDPFS-1.0.4-arm64.apk > dist/SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          pathlib.Path('dist/build-info.json').write_text(json.dumps({
              'app_version': '1.0.4',
              'app_commit': os.environ['GITHUB_SHA'],
              'udpfsd_commit': os.environ['UDPFSD_COMMIT'],
              'udpfsd_patch': 'android-nack1',
              'udpfsd_patch_sha256': hashlib.sha256(pathlib.Path('patches/udpfsd/0001-fix-nack-recovery.patch').read_bytes()).hexdigest(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'clean_build': True,
              'abi': 'arm64-v8a'
          }, indent=2) + '\n')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PS2-UDPFS-1.0.4-arm64-clean
          path: dist/
          if-no-files-found: error
