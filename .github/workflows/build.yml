name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build udpfsd for Android ARM64
        run: |
          git clone --depth 1 https://github.com/pcm720/udpfsd.git /tmp/udpfsd
          cd /tmp/udpfsd
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/app/src/main/assets/udpfsd" .
          chmod +x "$GITHUB_WORKSPACE/app/src/main/assets/udpfsd"
      - name: Make Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS2-UDPFS-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
